<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 330" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- 年份刻度 -->
  <text x="80"  y="18" text-anchor="middle" fill="#888" font-size="10">2020</text>
  <text x="230" y="18" text-anchor="middle" fill="#888" font-size="10">2021</text>
  <text x="380" y="18" text-anchor="middle" fill="#888" font-size="10">2022</text>
  <text x="530" y="18" text-anchor="middle" fill="#888" font-size="10">2023</text>
  <text x="680" y="18" text-anchor="middle" fill="#888" font-size="10">2024+</text>
  <line x1="20" y1="26" x2="730" y2="26" stroke="#eee"/>

  <!-- LSS 系 -->
  <text x="20" y="50" font-weight="600" fill="#1f5fa8" font-size="10">LSS 系</text>
  <rect x="55" y="38" width="50" height="24" rx="5" fill="#eef5ff" stroke="#4a90e2"/>
  <text x="80" y="55" text-anchor="middle" font-size="11" fill="#333">LSS</text>
  <rect x="210" y="38" width="70" height="24" rx="5" fill="#eef5ff" stroke="#4a90e2"/>
  <text x="245" y="55" text-anchor="middle" font-size="11" fill="#333">BEVDet</text>
  <rect x="355" y="38" width="80" height="24" rx="5" fill="#eef5ff" stroke="#4a90e2"/>
  <text x="395" y="55" text-anchor="middle" font-size="11" fill="#333">BEVDepth</text>
  <line x1="105" y1="50" x2="210" y2="50" stroke="#666" marker-end="url(#arr2)"/>
  <line x1="280" y1="50" x2="355" y2="50" stroke="#666" marker-end="url(#arr2)"/>

  <!-- BEV Transformer -->
  <text x="20" y="95" font-weight="600" fill="#2e7d32" font-size="10">BEV Transformer</text>
  <rect x="55" y="103" width="60" height="24" rx="5" fill="#eefaee" stroke="#4caf50"/>
  <text x="85" y="120" text-anchor="middle" font-size="11" fill="#333">DETR</text>
  <rect x="170" y="103" width="120" height="24" rx="5" fill="#eefaee" stroke="#4caf50"/>
  <text x="230" y="120" text-anchor="middle" font-size="11" fill="#333">Deformable DETR</text>
  <rect x="355" y="103" width="90" height="24" rx="5" fill="#eefaee" stroke="#4caf50"/>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#333">BEVFormer</text>
  <line x1="115" y1="115" x2="170" y2="115" stroke="#666" marker-end="url(#arr2)"/>
  <line x1="290" y1="115" x2="355" y2="115" stroke="#666" marker-end="url(#arr2)"/>

  <!-- Sparse Query -->
  <text x="20" y="160" font-weight="600" fill="#a85c12" font-size="10">Sparse Query</text>
  <rect x="170" y="168" width="70" height="24" rx="5" fill="#fff4e6" stroke="#f0932b"/>
  <text x="205" y="185" text-anchor="middle" font-size="11" fill="#333">DETR3D</text>
  <rect x="270" y="168" width="55" height="24" rx="5" fill="#fff4e6" stroke="#f0932b"/>
  <text x="298" y="185" text-anchor="middle" font-size="11" fill="#333">PETR</text>
  <rect x="360" y="168" width="72" height="24" rx="5" fill="#fff4e6" stroke="#f0932b"/>
  <text x="396" y="185" text-anchor="middle" font-size="11" fill="#333">Sparse4D</text>
  <rect x="470" y="168" width="90" height="24" rx="5" fill="#fff4e6" stroke="#f0932b"/>
  <text x="515" y="185" text-anchor="middle" font-size="11" fill="#333">StreamPETR</text>
  <line x1="240" y1="180" x2="270" y2="180" stroke="#666" marker-end="url(#arr2)"/>
  <line x1="325" y1="180" x2="360" y2="180" stroke="#666" marker-end="url(#arr2)"/>
  <line x1="432" y1="180" x2="470" y2="180" stroke="#666" marker-end="url(#arr2)"/>

  <!-- E2E -->
  <rect x="500" y="228" width="80" height="24" rx="5" fill="#fce4ec" stroke="#c2185b"/>
  <text x="540" y="245" text-anchor="middle" font-size="11" fill="#333">UniAD</text>
  <rect x="610" y="228" width="120" height="24" rx="5" fill="#fce4ec" stroke="#c2185b"/>
  <text x="670" y="245" text-anchor="middle" font-size="11" fill="#333">SparseDrive(V2)</text>
  <line x1="580" y1="240" x2="610" y2="240" stroke="#666" marker-end="url(#arr2)"/>

  <!-- 汇聚虚线 -->
  <path d="M435 62 C 455 62, 490 228, 500 240" stroke="#ccc" fill="none" stroke-dasharray="4 3"/>
  <path d="M445 115 C 465 115, 490 228, 500 240" stroke="#ccc" fill="none" stroke-dasharray="4 3"/>
  <path d="M560 180 C 570 180, 575 228, 570 240" stroke="#ccc" fill="none" stroke-dasharray="4 3"/>

  <!-- Occupancy -->
  <rect x="500" y="272" width="80" height="24" rx="5" fill="#ede7f6" stroke="#673ab7"/>
  <text x="540" y="289" text-anchor="middle" font-size="11" fill="#333">OccFormer</text>
  <rect x="610" y="272" width="120" height="24" rx="5" fill="#ede7f6" stroke="#673ab7"/>
  <text x="670" y="289" text-anchor="middle" font-size="11" fill="#333">4D World Model</text>
  <line x1="580" y1="284" x2="610" y2="284" stroke="#666" marker-end="url(#arr2)"/>
</svg>
