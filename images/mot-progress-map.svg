<rect x="30" y="492" width="1020" height="112" rx="16" fill="#e7edf7"/>
<text x="55" y="535" font-size="25" font-weight="600" fill="#182b46">检测：这一帧在哪里？</text>
<text x="55" y="575" font-size="25" font-weight="600" fill="#182b46">跟踪：与之前的哪个对象是同一个？</text>
</g></svg>