<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">位置在变，身份需要连续</title>
<desc id="desc">两个行人从相向行走到交叉遮挡，再重新出现。蓝色轨迹编号7和橙色轨迹编号12保持一致；遮挡时使用虚线表示待确认的历史状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="2"/></marker></defs>
<rect width="1080" height="640" rx="24" fill="#f3f6fb"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
<text x="40" y="58" font-size="32" font-weight="700" fill="#182b46">位置在变，身份需要连续</text>
<text x="40" y="96" font-size="22" fill="#50627c">同一个编号，连接不同时刻的观察</text>
<rect x="30" y="130" width="300" height="330" rx="18" fill="white" stroke="#dbe3ef"/><text x="50" y="168" font-size="25" font-weight="600" fill="#182b46">① 相向行走</text><path d="M45 375H315" stroke="#dbe3ef" stroke-width="3"/><text x="180" y="426" font-size="21" text-anchor="middle" fill="#50627c">建立轨迹</text>
<rect x="390" y="130" width="300" height="330" rx="18" fill="white" stroke="#dbe3ef"/><text x="410" y="168" font-size="25" font-weight="600" fill="#182b46">② 交叉与遮挡</text><path d="M405 375H675" stroke="#dbe3ef" stroke-width="3"/><text x="540" y="426" font-size="21" text-anchor="middle" fill="#50627c">保留历史，等待确认</text>
<rect x="750" y="130" width="300" height="330" rx="18" fill="white" stroke="#dbe3ef"/><text x="770" y="168" font-size="25" font-weight="600" fill="#182b46">③ 重新出现</text><path d="M765 375H1035" stroke="#dbe3ef" stroke-width="3"/><text x="900" y="426" font-size="21" text-anchor="middle" fill="#50627c">恢复对应，而非重新编号</text>
<g><rect x="65" y="220" width="70" height="150" rx="8" fill="none" stroke="#2875c9" stroke-width="3"/><text x="100" y="205" text-anchor="middle" fill="#2875c9" font-size="23" font-weight="700">ID 7</text><g opacity="1" fill="#2875c9" stroke="#2875c9" stroke-linecap="round"><circle cx="100" cy="248" r="14"/><path d="M100 271V313M78 298L100 275L122 298M100 313L80 350M100 313L120 350" fill="none" stroke-width="10"/></g></g>
<g><rect x="225" y="220" width="70" height="150" rx="8" fill="none" stroke="#c57623" stroke-width="3"/><text x="260" y="205" text-anchor="middle" fill="#c57623" font-size="23" font-weight="700">ID 12</text><g opacity="1" fill="#c57623" stroke="#c57623" stroke-linecap="round"><circle cx="260" cy="248" r="14"/><path d="M260 271V313M238 298L260 275L282 298M260 313L240 350M260 313L280 350" fill="none" stroke-width="10"/></g></g>
<g><rect x="520" y="220" width="70" height="150" rx="8" fill="none" stroke="#2875c9" stroke-width="3" stroke-dasharray="7 6"/><text x="555" y="205" text-anchor="middle" fill="#2875c9" font-size="23" font-weight="700">ID 7 ?</text><g opacity=".35" fill="#2875c9" stroke="#2875c9" stroke-linecap="round"><circle cx="555" cy="248" r="14"/><path d="M555 271V313M533 298L555 275L577 298M555 313L535 350M555 313L575 350" fill="none" stroke-width="10"/></g></g>
<g><rect x="428" y="220" width="70" height="150" rx="8" fill="none" stroke="#c57623" stroke-width="3"/><text x="463" y="205" text-anchor="middle" fill="#c57623" font-size="23" font-weight="700">ID 12</text><g opacity="1" fill="#c57623" stroke="#c57623" stroke-linecap="round"><circle cx="463" cy="248" r="14"/><path d="M463 271V313M441 298L463 275L485 298M463 313L443 350M463 313L483 350" fill="none" stroke-width="10"/></g></g>
<g><rect x="955" y="220" width="70" height="150" rx="8" fill="none" stroke="#2875c9" stroke-width="3"/><text x="990" y="205" text-anchor="middle" fill="#2875c9" font-size="23" font-weight="700">ID 7</text><g opacity="1" fill="#2875c9" stroke="#2875c9" stroke-linecap="round"><circle cx="990" cy="248" r="14"/><path d="M990 271V313M968 298L990 275L1012 298M990 313L970 350M990 313L1010 350" fill="none" stroke-width="10"/></g></g>
