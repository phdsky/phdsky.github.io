<rect x="519" y="271" width="143" height="87" rx="10" fill="#c5cedb" stroke="#8f9bac" stroke-width="2"/><rect x="530" y="284" width="49" height="30" rx="4" fill="#edf2f8"/><rect x="588" y="284" width="59" height="30" rx="4" fill="#edf2f8"/><circle cx="547" cy="360" r="12" fill="#738197"/><circle cx="637" cy="360" r="12" fill="#738197"/>
