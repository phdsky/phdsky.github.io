<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13">
  <text x="360" y="22" text-anchor="middle" font-weight="600" fill="#333">表示（Representation）</text>

  <!-- 表示大框 -->
  <rect x="30" y="34" width="660" height="122" rx="10" fill="none" stroke="#ccc" stroke-dasharray="5 3"/>

  <rect x="40"  y="44" width="180" height="105" rx="8" fill="#eef5ff" stroke="#4a90e2"/>
  <text x="130" y="66" text-anchor="middle" font-weight="600" fill="#1f5fa8">Object</text>
  <text x="130" y="90" text-anchor="middle" fill="#333">Sparse4D</text>
  <text x="130" y="110" text-anchor="middle" fill="#333">PETR</text>
  <text x="130" y="130" text-anchor="middle" fill="#333">StreamPETR</text>

  <rect x="270" y="44" width="180" height="105" rx="8" fill="#eefaee" stroke="#4caf50"/>
  <text x="360" y="66" text-anchor="middle" font-weight="600" fill="#2e7d32">BEV</text>
  <text x="360" y="90" text-anchor="middle" fill="#333">LSS / BEVDet</text>
  <text x="360" y="110" text-anchor="middle" fill="#333">BEVDepth</text>
  <text x="360" y="130" text-anchor="middle" fill="#333">BEVFormer</text>

  <rect x="500" y="44" width="180" height="105" rx="8" fill="#fff4e6" stroke="#f0932b"/>
  <text x="590" y="66" text-anchor="middle" font-weight="600" fill="#a85c12">Occupancy</text>
  <text x="590" y="90" text-anchor="middle" fill="#333">OccFormer</text>
  <text x="590" y="110" text-anchor="middle" fill="#333">4D 世界模型</text>

  <text x="180" y="192" text-anchor="middle" font-weight="600" fill="#333">几何（Geometry）</text>
  <rect x="40" y="200" width="300" height="100" rx="8" fill="#fafafa" stroke="#999"/>
  <text x="60" y="230" fill="#333"><tspan font-weight="600">lift</tspan>　　depth → 3D（LSS / BEVDet）</text>
  <text x="60" y="256" fill="#333"><tspan font-weight="600">project</tspan>　3D → 2D（BEVFormer / DETR3D）</text>
  <text x="60" y="282" fill="#333"><tspan font-weight="600">embedding</tspan>　PE 编码（PETR）</text>

  <text x="540" y="192" text-anchor="middle" font-weight="600" fill="#333">时序（Temporal）</text>
  <rect x="400" y="200" width="280" height="100" rx="8" fill="#fafafa" stroke="#999"/>
  <text x="420" y="230" fill="#333"><tspan font-weight="600">warp</tspan>　　BEV 对齐（量产主流）</text>
  <text x="420" y="256" fill="#333"><tspan font-weight="600">attention</tspan>　融合历史特征</text>
  <text x="420" y="282" fill="#333"><tspan font-weight="600">state</tspan>　　传播 query 状态</text>
</svg>
