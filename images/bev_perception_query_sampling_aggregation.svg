<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Query -->
  <rect x="240" y="16" width="200" height="48" rx="8" fill="#eef5ff" stroke="#4a90e2"/>
  <text x="340" y="36" text-anchor="middle" font-weight="600" fill="#1f5fa8">Query</text>
  <text x="340" y="54" text-anchor="middle" fill="#333" font-size="11">object / BEV grid / voxel</text>
  <line x1="340" y1="64" x2="340" y2="100" stroke="#666" marker-end="url(#arr3)"/>
  <text x="455" y="84" fill="#888" font-size="10">generate reference points</text>

  <!-- Sampling 外框 -->
  <rect x="40" y="100" width="600" height="160" rx="8" fill="#fafafa" stroke="#aaa"/>
  <text x="340" y="120" text-anchor="middle" font-weight="600" fill="#333">Sampling</text>

  <!-- projection -->
  <rect x="70" y="132" width="210" height="74" rx="6" fill="#eefaee" stroke="#4caf50"/>
  <text x="175" y="155" text-anchor="middle" font-weight="600" fill="#2e7d32">projection</text>
  <text x="175" y="174" text-anchor="middle" fill="#333" font-size="11">算位置</text>
  <text x="175" y="192" text-anchor="middle" fill="#666" font-size="10">BEVFormer / DETR3D</text>

  <!-- embedding lookup -->
  <rect x="400" y="132" width="210" height="74" rx="6" fill="#fff4e6" stroke="#f0932b"/>
  <text x="505" y="155" text-anchor="middle" font-weight="600" fill="#a85c12">embedding lookup</text>
  <text x="505" y="174" text-anchor="middle" fill="#333" font-size="11">学位置</text>
  <text x="505" y="192" text-anchor="middle" fill="#666" font-size="10">PETR</text>

  <!-- multi-view features -->
  <rect x="215" y="222" width="250" height="22" rx="5" fill="#fff" stroke="#999"/>
  <text x="340" y="237" text-anchor="middle" fill="#333" font-size="11">multi-view image features</text>
  <line x1="175" y1="206" x2="270" y2="222" stroke="#888" marker-end="url(#arr3)"/>
  <line x1="505" y1="206" x2="410" y2="222" stroke="#888" marker-end="url(#arr3)"/>

  <!-- arrow down -->
  <line x1="340" y1="260" x2="340" y2="300" stroke="#666" marker-end="url(#arr3)"/>
  <text x="455" y="284" fill="#888" font-size="10">weighted sum / pooling</text>

  <!-- Aggregation -->
  <rect x="200" y="300" width="280" height="50" rx="8" fill="#fce4ec" stroke="#c2185b"/>
  <text x="340" y="322" text-anchor="middle" font-weight="600" fill="#880e4f">Aggregation</text>
  <text x="340" y="340" text-anchor="middle" fill="#333" font-size="11">attention / splat / conv / MLP</text>

  <!-- task head -->
  <line x1="340" y1="350" x2="340" y2="385" stroke="#666" marker-end="url(#arr3)"/>
  <text x="340" y="405" text-anchor="middle" fill="#333" font-weight="600">task head：det / map / occ / plan</text>
</svg>
